# Input section
input {
  http {
    id => "tpot"
    host => "0.0.0.0"
    port => "64305"
    ecs_compatibility => disabled
  }
}

# Output section
output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    # With templates now being legacy we need to set the daily index with its template manually. Otherwise a new index might be created with differents settings configured through Kibana.
    index => "logstash-%{+YYYY.MM.dd}"
    template => "/etc/logstash/tpot-template.json"
    template_overwrite => "true"
  }

  # Forward sensor events to Rank-MDR Backend
  # (removed at startup by entrypoint.sh if RANK_MDR_INGEST_URL is not set)
  http {
    url => "${RANK_MDR_INGEST_URL}"
    http_method => "post"
    http_compression => true
    codec => "json"
    format => "json_batch"
    headers => {
      "X-API-Key" => "${RANK_MDR_API_KEY}"
    }
    retry_non_idempotent => true
    automatic_retries => 5
    retry_failed => true
    connect_timeout => 10
    socket_timeout => 30
    pool_max => 10
    pool_max_per_route => 5
  }

}
